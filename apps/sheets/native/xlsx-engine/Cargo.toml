[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
# cdylib: the wasm build exports sidecar_handle_line & co for a JS host
# (src/wasm.rs). rlib keeps the native bin and `cargo test` working unchanged.
crate-type = ["cdylib", "rlib"]

[features]
# Run indexing and recalc inline instead of on threads, as WebAssembly builds
# without threads must; lets that path be tested on any machine.
single-thread = []

[dependencies]
base64 = "0.22.1"
calamine = "0.37.0"
cfb = "0.15"
ironcalc = "0.9.1"
quick-xml = { version = "0.38", features = ["encoding"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
